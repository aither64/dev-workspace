name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Essential application contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Prepare patched Pi SDK source
        run: nix build --no-link --print-build-logs .#pi-sdk-source
      - name: Evaluate all checks
        run: nix flake check --no-build --print-build-logs
      - name: Build essential application contracts
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.package \
            .#checks.x86_64-linux.ruby-essential-verification \
            .#checks.x86_64-linux.package-check-separation \
            .#checks.x86_64-linux.codex-package \
            .#checks.x86_64-linux.pi-worker \
            .#checks.x86_64-linux.pi-runtime-host-unit \
            .#checks.x86_64-linux.pi-runtime-host-environment \
            .#checks.x86_64-linux.ruby-source-filter \
            .#checks.x86_64-linux.host-module \
            .#checks.x86_64-linux.host-auth-benchmark \
            .#checks.x86_64-linux.host-package-contract \
            .#checks.x86_64-linux.generic-source
  extended:
    name: Extended Ruby and package composition
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Full Ruby and package composition
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.ruby-verification \
            .#checks.x86_64-linux.extension-catalog \
            .#checks.x86_64-linux.agent-team-catalog \
            .#checks.x86_64-linux.user-namespace
  archive:
    name: Extended session archive/recovery
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable VM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Packaged browser archive, recovery and revival
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.session-archive-lifecycle
  creation:
    name: Session creation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable VM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Session creation smoke
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.session-creation
  host:
    name: Extended host lifecycle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable VM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Activation, renewal, rollback and user-service boot tests
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.host-module-idempotency \
            .#checks.x86_64-linux.session-recovery-boot \
            .#checks.x86_64-linux.pi-runtime-host
