{{define "browser-notifications"}}
<section id="browser-notifications" class="panel">
  <h3>Browser notifications</h3>
  <p>Notifications can appear while the browser is running with every portal tab closed. They show session names, which may appear on your lock screen. Delivery uses your browser vendor’s push service.</p>
  <p data-notification-status role="status">Checking browser notifications…</p>
  <div class="actions"><button type="button" data-notification-enable>Enable browser notifications</button><button type="button" data-notification-test disabled>Send test notification</button><button type="button" class="quiet" data-notification-disable disabled>Disable on this browser</button></div>
</section>
{{end}}
