{{define "operations"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations · {{.DisplayLabel}}</title>
  <link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body data-operations>
  <header class="topbar">
    <div><p class="eyebrow">{{.DisplayLabel}}</p><h1>Operations</h1></div>
    <a href="/">Back to workspace</a>
  </header>
  <main class="page">
    <p data-coordination-warning class="notice warning" role="status" hidden></p>
    <div class="coordination-intro"><p>See which sessions hold machines and which operations are waiting.</p><p class="muted" data-coordination-refreshed role="status"></p></div>
    <div data-coordination class="coordination-layout">Loading operations…</div>
  </main>
  <script src="/static/coordination.js?v=6" defer></script>
</body>
</html>
{{end}}
